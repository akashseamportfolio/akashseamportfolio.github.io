name: Morph progress — ClickUp sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: morph-progress-pages
  cancel-in-progress: false
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout existing portfolio
        uses: actions/checkout@v4
      - name: Sync task totals
        id: sync
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
        run: |
          if [ -z "$CLICKUP_API_TOKEN" ]; then
            echo "CLICKUP_API_TOKEN not set; keeping public snapshot unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            python3 morph/sync_clickup.py
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.sync.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload portfolio and refreshed Morph page
        if: steps.sync.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy GitHub Pages
        if: steps.sync.outputs.ready == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
