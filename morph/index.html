<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#182731">
<meta name="description" content="Morph.">
<meta name="robots" content="noindex,nofollow">
<title>Morph — Development Progress | Akash Seam</title>
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F3F5;--ink:#182731;--body:#36444c;--dim:#5d6870;
  --panel:#F0F3F5;--accent:#F50057;--accent-base:#F50057;
  --hair:#1827314d;--soft:#1827310f;--grid:#18273109;--track:#18273125;
  --inactive:#6f7d86;--active-text:#182731;--hover-bg:#18273108;
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#182731;--ink:#F0F3F5;--body:#d4d8dc;--dim:#afb6ba;
  --panel:#1d2c36;--hair:#F0F3F547;--soft:#F0F3F512;
  --grid:#F0F3F508;--track:#F0F3F52A;--inactive:#a3b2bc;
  --active-text:#F0F3F5;--hover-bg:#F0F3F50A;
  color-scheme:dark
}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 'Space Grotesk',system-ui,sans-serif;transition:background-color .24s,color .24s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:44px 44px}
button{font:inherit}
a{color:inherit}
.shell{width:min(860px,calc(100% - 72px));margin-inline:auto}
.site-head{border-bottom:1px solid var(--hair)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.02em}
.brand-mark{height:20px;width:20px;display:inline-block;flex:none;background:var(--accent);transition:transform .2s ease;transform-origin:center}
.brand:hover .brand-mark{transform:rotate(90deg)}
.nav-actions{display:flex;align-items:center;gap:18px}
.back{font:500 10px/1.3 'JetBrains Mono',monospace;letter-spacing:.10em;text-decoration:none;color:var(--dim);transition:color .18s}
.back:hover{color:var(--accent)}

.theme-toggle{display:grid;place-items:center;width:35px;height:35px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;
 transition:background .18s,color .18s,border-color .18s,transform .18s}
.theme-toggle:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.theme-toggle:focus-visible,.back:focus-visible,.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.theme-toggle svg{height:16px;width:16px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
[data-theme="dark"] .sun{display:block}[data-theme="dark"] .moon{display:none}
[data-theme="light"] .sun{display:none}[data-theme="light"] .moon{display:block}
main{padding-top:clamp(68px,12vh,120px);padding-bottom:110px}
h1{font-weight:700;font-size:clamp(68px,13vw,116px);letter-spacing:-.085em;line-height:.96;margin:0}
h1 span{color:var(--accent)}
.progress-area{margin-top:clamp(54px,10vh,78px)}
.overall{padding-bottom:49px;border-bottom:1px solid var(--hair)}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.label{font-weight:700;font-size:15px;letter-spacing:-.015em}
.pct{font-weight:700;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.overall .pct{color:var(--accent);font-size:22px}
.track{height:8px;background:var(--track);position:relative;overflow:hidden;margin-top:14px;border-radius:0}
.track::after{content:"";pointer-events:none;position:absolute;inset:0;border:1px solid transparent;transition:border-color .2s}
.fill{height:100%;background:var(--inactive);width:0%;transition:width .85s cubic-bezier(.2,.8,.2,1),background-color .3s}
.overall .track{height:12px;margin-top:16px}
.overall .fill{background:var(--accent)}
.overall:hover .track::after{border-color:var(--accent)}
.overall:hover .fill{filter:brightness(1.12)}
.count{margin-top:12px;color:var(--dim);font:500 11px/1.5 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.group-label{margin:32px 0 14px;color:var(--dim);font:500 10px/1.5 'JetBrains Mono',monospace;letter-spacing:.13em;text-transform:uppercase}
.milestones{display:grid;gap:4px}
.milestone{margin:0 -18px;padding:17px 18px 16px;border-left:3px solid transparent;transition:background-color .18s,border-color .18s,transform .18s}
.milestone:hover{background:var(--hover-bg);border-left-color:var(--accent);transform:translateX(3px)}
.milestone .line{align-items:center}
.milestone .label{display:inline-flex;align-items:center;gap:11px;font-size:14px;transition:color .2s}
.milestone .pct{font-size:14px;transition:color .2s}
.milestone .track{height:7px;margin-top:12px}
.milestone:hover .track::after{border-color:var(--accent)}
.end{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-top:1px solid var(--hair);margin-top:45px;padding-top:20px;color:var(--dim)}
.stamp{font:400 10px/1.7 'JetBrains Mono',monospace}
.stamp{font-variant-numeric:tabular-nums}.error{color:var(--accent)}
@media(max-width:650px){
 .shell{width:calc(100% - 40px)}
 .nav{min-height:65px}
 .nav-actions{gap:12px}
 .brand{font-size:12px}
 h1{font-size:clamp(64px,17vw,90px)}
 main{padding-top:75px}
 .progress-area{margin-top:65px}
 .milestone{margin:0 -11px;padding:16px 11px}
 .milestone:hover{transform:none}
 .end{flex-direction:column;align-items:flex-start}
 .footnote{text-align:left}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.milestone .count{margin-top:8px}
.refresh-link{text-underline-offset:4px;padding:8px 0;transition:color .18s}.refresh-link:hover{color:var(--accent)}.refresh-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.refresh-link:active{opacity:.7}
</style>
</head>
<body>
<header class="site-head">
  <div class="shell nav">
    <a class="brand" href="/" aria-label="Akash Seam portfolio"><span class="brand-mark" aria-hidden="true"></span>AKASH SEAM</a>
    <div class="nav-actions">
      <a class="back" href="/">← PORTFOLIO</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.8A8.8 8.8 0 0 1 9.2 3.5a8.8 8.8 0 1 0 11.3 11.3Z"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="shell">
  <h1>MORPH<span>.</span></h1>
  <div class="progress-area">
    <section class="overall" data-stage="overall" aria-label="Overall progress">
      <div class="line"><span class="label">Overall progress</span><output class="pct">4.7%</output></div>
      <div class="track" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4.7" aria-valuetext="15 of 317 tasks completed"><div class="fill" style="width:4.7%"></div></div>
      <div class="count" aria-label="15 of 317 tasks completed">15 / 317</div>
    </section>
    <div class="group-label">MILESTONES</div>
    <section class="milestones" aria-label="Development milestones">
    <section class="milestone" data-stage="Greybox" aria-label="Greybox">
      <div class="line"><span class="label">Greybox</span><output class="pct">18.1%</output></div>
      <div class="track" role="progressbar" aria-label="Greybox" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18.1" aria-valuetext="15 of 83 tasks completed"><div class="fill" style="width:18.1%"></div></div>
      <div class="count" aria-label="15 of 83 tasks completed">15 / 83</div>
    </section>
    <section class="milestone" data-stage="Pitch" aria-label="Pitch">
      <div class="line"><span class="label">Pitch</span><output class="pct">0%</output></div>
      <div class="track" role="progressbar" aria-label="Pitch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 of 71 tasks completed"><div class="fill" style="width:0%"></div></div>
      <div class="count" aria-label="0 of 71 tasks completed">0 / 71</div>
    </section>
    <section class="milestone" data-stage="Alpha" aria-label="Alpha">
      <div class="line"><span class="label">Alpha</span><output class="pct">0%</output></div>
      <div class="track" role="progressbar" aria-label="Alpha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 of 141 tasks completed"><div class="fill" style="width:0%"></div></div>
      <div class="count" aria-label="0 of 141 tasks completed">0 / 141</div>
    </section>
    <section class="milestone" data-stage="Beta" aria-label="Beta">
      <div class="line"><span class="label">Beta</span><output class="pct">0%</output></div>
      <div class="track" role="progressbar" aria-label="Beta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 of 17 tasks completed"><div class="fill" style="width:0%"></div></div>
      <div class="count" aria-label="0 of 17 tasks completed">0 / 17</div>
    </section>
    <section class="milestone" data-stage="Full Release" aria-label="Full Release">
      <div class="line"><span class="label">Full Release</span><output class="pct">0%</output></div>
      <div class="track" role="progressbar" aria-label="Full Release" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 of 5 tasks completed"><div class="fill" style="width:0%"></div></div>
      <div class="count" aria-label="0 of 5 tasks completed">0 / 5</div>
    </section>
    </section>
    <footer class="end"><span class="stamp">Last updated <time id="last-updated">unavailable</time></span><a class="stamp refresh-link" href="https://github.com/akashseamportfolio/akashseamportfolio.github.io/actions/workflows/morph-progress.yml" target="_blank" rel="noopener noreferrer" title="Open GitHub, then select Run workflow on main" aria-label="Refresh data through GitHub Actions (opens a new tab)">Refresh data ↗</a></footer>
    <span id="status" class="sr-only" role="status"></span>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const root=document.documentElement;
  const toggle=document.getElementById('theme-toggle');
  const theme=()=>root.dataset.theme==='dark'?'dark':'light';
  function syncToggle(){
    const label=theme()==='dark'?'Switch to light mode':'Switch to dark mode';
    toggle.setAttribute('aria-label',label);
    toggle.title=label;
  }
  syncToggle();
  toggle.addEventListener('click',()=>{
    const next=theme()==='dark'?'light':'dark';
    root.dataset.theme=next;
    root.style.colorScheme=next;
    try{localStorage.setItem('akash-theme',next)}catch{}
    syncToggle();
  });
  function update(stage,record){
    if(!record)return;
    const row=document.querySelector('[data-stage="'+stage+'"]');
    if(!row)return;
    const done=Math.max(0,Number(record.done)||0), total=Math.max(0,Number(record.total)||0);
    const ratio=total?Math.max(0,Math.min(100,done/total*100)):0;
    const rounded=Math.round(ratio*10)/10;
    row.querySelector('.pct').textContent=rounded.toFixed(Number.isInteger(rounded)?0:1)+'%';
    const bar=row.querySelector('.track');
    bar.setAttribute('aria-valuenow',String(rounded));
    bar.querySelector('.fill').style.width=ratio+'%';
    const count=row.querySelector('.count');
    count.textContent=done+' / '+total;
    count.setAttribute('aria-label',done+' of '+total+' tasks completed');
    bar.setAttribute('aria-valuetext',done+' of '+total+' tasks completed');
  }

  // Poll only the publicly deployed JSON. This makes no authenticated ClickUp calls.
  // The private ClickUp sync continues on the GitHub Actions schedule.
  let loading=false;
  async function checkPublished(){
    if(loading||document.visibilityState==='hidden')return;
    loading=true;
    try{
      const response=await fetch('./progress.json?fresh='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw Error('HTTP '+response.status);
      const data=await response.json();
      if(!data||!data.overall||!data.stages)throw Error('Missing progress data');
      update('overall',data.overall);
      for(const stage of ['Greybox','Pitch','Alpha','Beta','Full Release'])update(stage,data.stages[stage]);
      const updated=new Date(data.updatedAt);
      if(data.updatedAt && !Number.isNaN(updated.getTime())){
        const stamp=document.getElementById('last-updated');
        stamp.dateTime=updated.toISOString();
        stamp.textContent=new Intl.DateTimeFormat(undefined,{
          year:'numeric',month:'short',day:'numeric',
          hour:'numeric',minute:'2-digit',timeZoneName:'short'
        }).format(updated);
        stamp.title='Last successful ClickUp sync';
      }
      document.getElementById('status').textContent='';
    }catch(err){
      document.getElementById('status').textContent='Progress update unavailable. Showing saved counts.';
    }finally{loading=false;}
  }
  checkPublished();
  window.setInterval(checkPublished,120000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkPublished();});
})();
</script>
</body>
</html>
