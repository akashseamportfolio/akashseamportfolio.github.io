<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182731"><title>Morph — Development Progress</title><style>
:root{color-scheme:dark;--bg:#182731;--fg:#f0f3f5;--muted:#a7b5be;--track:#354751;--accent:#f50057}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(600px,calc(100% - 44px));padding:60px 0}a{color:var(--muted);text-decoration:none;font-size:12px}a:hover{color:var(--fg)}
h1{font-size:clamp(56px,11vw,88px);letter-spacing:-.07em;margin:48px 0 0;line-height:1}h1 span{color:var(--accent)}
p{color:var(--muted);margin:12px 0 62px}.item{margin-bottom:31px}.overall{margin-bottom:60px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:13px;font-size:13px;font-weight:600}.num{font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--track);border-radius:20px;overflow:hidden}.fill{width:0;height:100%;background:#c4cdd1;border-radius:20px;transition:width .7s ease}
.overall .track{height:10px}.overall .fill{background:var(--accent)}.detail{font-size:12px;color:var(--muted);margin-top:12px}
footer{margin-top:58px;padding-top:16px;border-top:1px solid var(--track);font-size:11px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style></head><body><main><a href="/">← Portfolio</a><h1>MORPH<span>.</span></h1><p>Development progress</p>
<section class="item overall" data-stage="overall"><div class="heading"><span>Overall</span><output class="num">2.1%</output></div><div class="track" role="progressbar" aria-label="Overall" aria-valuemin="0" aria-valuemax="100" aria-valuenow="2.1"><div class="fill" style="width:2.1%"></div></div><div class="detail">7 of 334 tasks complete</div></section>
<section aria-label="Milestones">
<div class="item" data-stage="Pitch"><div class="heading"><span>Pitch</span><output class="num">0%</output></div><div class="track" role="progressbar" aria-label="Pitch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div></div>
<div class="item" data-stage="Alpha"><div class="heading"><span>Alpha</span><output class="num">0%</output></div><div class="track" role="progressbar" aria-label="Alpha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div></div>
<div class="item" data-stage="Beta"><div class="heading"><span>Beta</span><output class="num">0%</output></div><div class="track" role="progressbar" aria-label="Beta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div></div>
<div class="item" data-stage="Full Release"><div class="heading"><span>Full Release</span><output class="num">0%</output></div><div class="track" role="progressbar" aria-label="Full Release" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill"></div></div></div>
</section><footer id="foot">ClickUp snapshot · October 29, 2026</footer></main>
<script>
function show(row,d){if(!row||!d)return;const pct=d.total?Math.max(0,Math.min(100,Math.round(d.done/d.total*1000)/10)):0;row.querySelector(".num").textContent=pct.toFixed(pct%1?1:0)+"%";const t=row.querySelector(".track");t.setAttribute("aria-valuenow",pct);row.querySelector(".fill").style.width=pct+"%"}
fetch("./progress.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{show(document.querySelector('[data-stage="overall"]'),j.overall);document.querySelector(".detail").textContent=j.overall.done+" of "+j.overall.total+" tasks complete";for(const s of ["Pitch","Alpha","Beta","Full Release"])show(document.querySelector('[data-stage="'+s+'"]'),j.stages[s]);if(j.source==="clickup"&&j.updatedAt)document.getElementById("foot").textContent="Synced from ClickUp · "+new Date(j.updatedAt).toLocaleString()}).catch(()=>{document.getElementById("foot").textContent="Saved ClickUp snapshot"});
</script></body></html>
